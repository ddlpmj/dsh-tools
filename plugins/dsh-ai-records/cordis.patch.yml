# dsh-ai-records bundle patch：把「AI 访谈档案」挂进 profile。
# row id 稳定，用户可在自己的 profile patch 中按 id 覆盖 config 或 disable。
- insert:
    - id: dsh-ai-records
      name: 'dsh-ai-records'
      config:
        enabled: true
        # 空字符串 = 默认 ~/Documents/DSH工具数据/AI访谈档案
        rootDir: ''
        # 本地 ASR：auto = 优先 faster-whisper，不可用回退宿主 speechToText
        asrEngine: auto
        # 云端模型（百炼异步 filetrans）
        asrCloudModel: qwen-audio-3.1-asr-flash-filetrans
        # 本地兜底模型：large-v3-turbo | small | base
        asrLocalModel: small
        # faster-whisper 运行时目录（空 = rootDir/runtime）
        runtimeDir: ''
        # 单条音频并发上限
        concurrency: 1
        # 说话人分离（访谈/圆桌必开）
        diarization: true
        hotwords: []
        # 定时任务：每多少分钟检查一次新内容（0 = 关闭）
        autoSyncMinutes: 0
        # 每次最多自动收录几条
        autoMaxPerRun: 2
        # 每个来源一次扫描看多少条
        autoScanLimit: 5
        # 当日自动收录的花费上限（元），超过就跳过这一轮
        autoDailyBudgetCny: 30
